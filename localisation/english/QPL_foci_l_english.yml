l_english:
 # Futurist Buildup
 QPL_onwards: "Onwards!"
 QPL_onwards_desc: "What this country needs is true, radical change. The reactionaries want to bring back this country back to the middle ages and we cannot let them."
 QPL_nationwide_tour: "Do a Nationwide Tour"
 QPL_nationwide_tour_desc: "In preparation for the election, our leader Kit Traum decided to do a tour across the entire country to boost support for the Futurists"
 QPL_appeal_to_the_left: "Appeal to the Left"
 QPL_appeal_to_the_left_desc: "We cannot defeat the Reactionaries alone, we must ask for the support of major leftist figures like the Governor of Cascadia Lorelai Denham and the popular gubernatorial candidate in Dixie August Holiday."
 QPL_train_futurist_paramilitaries: "Train Paramilitaries"
 QPL_train_futurist_paramilitaries_desc: "Seeing as the paramilitary wing of the Ordem Reactionarium expanded and attempted to rig the last election, a civil war seems inevitable. We should be prepared to crush any reactionary revolts."
 QPL_secure_military: "Secure the Military"
 QPL_secure_military_desc: "There have been disturbing reports coming about the loyalty of the military, we need to sway the most experienced parts of the military to our side."
 QPL_secure_gendarmerie: "Secure the Gendarmerie"
 QPL_secure_gendarmerie_desc: "There have been disturbing reports coming about the loyalty of the military, we need to sway the gendarmerie to our side."
 QPL_crush_the_reaction: "Crush the Reaction"
 QPL_crush_the_reaction_desc: "We're ready to crush the reactionaries, we should preempt them in order to gain a strategic advantage."
 
# Futurist side
 QPL_towards_the_future: "Towards the Future!"
 QPL_towards_the_future_desc: "Uhh idk smth."

 # Socialist/Anarchist side
 QPL_god_save_the_south: "God Save the South!"
 QPL_god_save_the_south_desc: "The Futurists and the Reactionaries are two sides of the same coin in the end. Now that all hell has broken loose, there is no need to humor this torment of mankind. We shall put our destiny in our own hands!"

 # Reactionary Buildup
 QPL_defend_tradition: "Defend Tradition"
 QPL_defend_tradition_desc: "The left is attempting to destroy the traditional values of our great civilization, we cannot stand for this. We need to organize and defend our country at all costs, even with violence if necessary..."
 QPL_form_party: "Form a New Party"
 QPL_form_party_desc: "As the election approaches, the growing Reactionary movement is still still splintered across various parties. We need to fix this and consolidate around a single leader."
 QPL_train_reactionary_paramilitaries: "Train Paramilitaries"
 QPL_train_reactionary_paramilitaries_desc: "As the elections are approaching and a Futurist victory is looking ever more likely, we could perhaps train militias that could... \"change\" the minds of some voters and perhaps even \"convince\" the Futurist traitors to \"step down\" if necessary."
 QPL_campaign_chest: "Hand Over the Campaign Chest"
 QPL_campaign_chest_desc: "Our election campaign may have been a failure, but we still have quite some money left over after it. We should distribute it to our militias and the non-traitorous parts of the military in order to help our plan to save Queerplatonia."
 QPL_rojo_negotiations: "Ask the Shogunate for Help"
 QPL_rojo_negotiations_desc: "We could ask the Rojoian Shogunate for help during the civil war, however this may come at a cost..."
 QPL_protect_sovereignity: "Protect Our Sovereignity At All Costs"
 QPL_protect_sovereignity_desc: "We cannot risk our territorial integrity by asking the Rojoian Shogunate for help, we can win this war without their help."
 QPL_futurist_ultimatum: "Ultimatum for the Futurists"
 QPL_futurist_ultimatum_desc: "The time has come, we shall free our nation from the Futurist yoke!"
 QPL_long_live_the_republic: "Long Live The Republic!"
 QPL_long_live_the_republic_desc: "We do not need the monarchy for a strong Queerplatonia. Instead, the central figure of our country should be Jessica Monroe."
 QPL_long_live_the_queen: "Long Live the Queen!"
 QPL_long_live_the_queen_desc: "The Queen is a symbol of the nation's unity, we should establish a regenecy before she can return."
