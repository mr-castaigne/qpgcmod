 usa.1.t:0 "Mike Johnson Forms New Cabinet"
 usa.1.desc:0 "After the disappearance of most of the Trump administration, Acting President Mike Johnson has quickly moved to appoint a new cabinet. In a somewhat unexpected manner, Johnson decided to appoint most qualified individuals in order to unite the nation in this dire moment. Johnson has appointed Nikki Haley as Secretary of State, "
 
 usa.2.t:0 "Senate Confirms New Supreme Court"
 usa.2.desc:0 "As the entire Supreme Court had gone missing, President Johnson has appointed new Supreme Court justices. After looking at polling and listening to advisors, Johnson decided that the best move was to restore the 6-3 court, though this was controversial with senate republicans and the liberal nominees were barely confirmed. Johnson appointed the liberals Jill A. Pryor, Debra Brown, and Albert Diaz, the first being a judge in the federal Court of Appeals for the Eleventh Circuit, the second being the chief district judge of the district court of North Mississippi, and the third being the chief circuit judge of the federal Court of Appeals for the Fourth Circuit."
 
 usa.10.t:0 "The Democratic National Convention"
 usa.10.desc:0 "As the impromptu blitz primaries have come to an end, the delegates have assembled in the city of Asheville for the Democratic National Convention. The crowd's mood is lackluster due to the perceived unlikeliness of a Democratic victory and literally everything else that has been happening, however the nominee still has to be chosen. The two main contenders are the former governor of North Carolina Roy Cooper and the junior senator from Georgia and pastor Raphael Warnock. The voters have decided that..."
 usa.10.a:0 "We needed a moderate and unifying candidate"
 usa.10.b:0 "We needed someone charismatic who can appeal to Black voters"

 usa.11.t:0 "The Republican National Convention"
 usa.10.desc:0 "As the impromptu blitz primaries have come to an end, the delegates have assembled in the city of Savannah for the Republican National Convention. The crowd's mood is mixed, with the perceived likelihood of a Republican victory inspiring excitement and joy on the one hand and literally everything else happening causing confusion and uncertainty on the other. Regardless of how the crowd feels, the nominee still has to be chosen. The three main contenders are the governor of Georgia Brian Kemp, the governor of Arkansas Sarah Huckabee Sanders, and the former governor of South Carolina and ambassador to the UN Nikki Haley. The voters have decided that..."
 usa.10.a:0 "We needed a moderate and unifying candidate"
 usa.11.a:0 "We needed a traditional conservative who will unify the nation"
 usa.11.b:0 "We needed someone who will continue Trump's legacy"
 usa.11.c:0 "We needed someone with strong foreign policy credentials"

 USA_first_elections:0 "Elections will be held in 60 days"
 USA_first_dnc_cooper:0 "Roy Cooper will become the Democratic nominee"
 USA_first_dnc_warnock:0 "Raphael Warnock will become the Democratic nominee"
 USA_first_rnc_kemp:0 "Brian Kemp will become the Republican nominee"
 USA_first_rnc_sanders:0 "Sarah Huckabee Sanders will become the Republican nominee"
 USA_first_rnc_haley:0 "Nikki Haley will become the Republican nominee"

 usa.12.t:0 "Roy Cooper Wins Presidential Election in an Upset!"
 usa.12.desc:0 "Defying all odds, the former governor of North Carolina and longshot candidate Roy Cooper has won the presidency of the United States of America by one electoral vote. The Deep South, which currently constitutes all of the US, is a heavily conservative region and therefore the Democrats were not expected to win. The RealClearPolling average before the election was showing Cooper trailing in the popular vote by 3% and trailing in the tipping-point state and Republican nominee Nikki Haley's home state South Carolina by 6%, but President-Elect Cooper went on to win the popular vote by an astounding 6% and South Carolina by nearly 4%. Pollsters are at a complete loss as to why they missed by so much. Roy Cooper's coattails have caused the Democrats to flip the 65 member House of Representatives by 1 seat and caused the senate seats of North Carolina, South Carolina, Mississippi, and Louisiana to flip to the Democrats by 16.4, 6.8, 4.9, and 0.9 percent respectively, giving Democrats and Republicans 6 and 10 seats respectively. Haley has already called Cooper to concede the race and asked her supporters to accept her loss."
 usa.12.a:0 "Hail to the Chief!"

 usa.13.t:0 "Raphael Warnock Wins Presidential Election in and Upset!"
 usa.13.desc:0 "Defying all odds, the junior senator from Georgia, pastor, and longshot candidate Raphael Warnock has won the presidency of the United States of America by one electoral vote. The Deep South, which currently constitutes all of the US, is a heavily conservative region and therefore the Democrats were not expected to win. The RealClearPolling average before the election was showing Warnock trailing in the popular vote by 5% and by by 4% in the tipping-point state of South Carolina, but President-Elect Warnock went on to win the popular vote by an astounding 5% and South Carolina by nearly 6%. Pollsters are at a complete loss as to why they missed by so much. Warnock's coattails have caused the Democrats to flip the 65 member House of Representatives by 1 seat and caused the senate seats of North Carolina, South Carolina, Mississippi, and Louisiana to flip to the Democrats by 20.3, 8.4, 5.7, and 1.2 percent respectively, giving Democrats and Republicans 6 and 10 seats respectively. Interestingly both candidates were from the state of Georgia, where Warnock defeated the popular governor Brian Kemp by 16%. Kemp has already called Warnock to concede the race and asked his supporters to accept his loss."
 usa.13.a:0 "Hail to the Chief!"

 usa.14.t:0 "Brian Kemp Wins Presidential Election!"
 usa.14.desc:0 "As expected, the popular Republican Governor of Georgia Brian Kemp has won the presidency of the United States. Kemp, facing Senator Raphael Warnock, a fellow Georgian, has won both the popular vote and the tipping-point state of South Carolina by around 4%. Warnock won the two largest states of the union - Georgia and North Carolina - by 5.1 and 6.8 percent respectively, giving him 32 electoral votes in comparison to Kemp's 49. As expected, Republicans have a supermajority in both chambers of congress, but notably Republican Senator from Mississippi Cindy Hyde-Smith has lost re-election by a mere 0.3% in an upset, Mississippi went to Kemp by 8%. There are also 3 Democrats who were elected in districts that Kemp won: London Lamar in TN-09, Jamie Ager in NC-11, and Richard Ojeda in NC-09. In total, Democrats won 19 sets in the House in comparison to the Republicans' 46. Democrats have 4 seats in the senate in comparison to the Republicans' 12. Warnock will return to the senate while Kemp will be succeded by Governor-Elect Keisha Lance Bottoms who defeated Republican Rick Jackson by 1.7% on the same ballot that senators Raphael Warnock and Jon Ossoff won on by 5.1 and 7.1 percentage points respectively. Warnock has already called Kemp to concede."
 usa.14.a:0 "Hail to the Chief!"
 
 usa.15.t:0 "Sarah Huckabee Sanders Narrowly Wins Presidential Election!"
 usa.15.desc:0 "As expected, the Republican Governor of Arkansas Saraha Huckabee Sanders has won the presidency of the United States, however the victory was far narrower than anticipated. Sanders, facing junior senator from Georgia Raphael Warnock narrowly won the popular vote by 1% and the tipping-point state of South Carolina by a mere 0.7%. Warnock won the two largest states of the union - Georgia and North Carolina - by 12.2 and 8.1 percent respectively, giving him 32 electoral votes in comparison to Sanders' 49. Surprisingly, Democrats have prevented the Republicans from achieving a supermajority in the House, but notably Republican senator from Mississippi and South Carolina Cindy Hyde-Smith and Lindsey Graham have lost re-election by 3.5% and 1.8% respectively in upsets, Mississippi went to Sanderss by 6%. There are also 3 Democrats who were elected in districts that Sanders won: Jamie Ager in NC-11, Richard Ojeda in NC-09, and Chris Jones in AR-02. In total, Democrats won 22 sets in the House in comparison to the Republicans' 43. Democrats have 5 seats in the senate in comparison to the Republicans' 12. Warnock has already called Sanders to concede."
 usa.15.a:0 "Hail to the Chief!"
 
 usa.16.t:0 "Nikki Haley Wins Presidential Election!"
 usa.14.desc:0 "As expected, the former Republican Governor of South Carolina and ambassador to the UN Nikki Haley has won the presidency of the United States. Haley, facing former governor of North Carolina Roy Cooper, has won the popular vote by around 4% and the tipping-point state of South Carolina, which is also her home state, by 6.5%. Cooper won the two largest states of the union - Georgia and North Carolina - by 7.5 and 8.4 percent respectively, giving him 32 electoral votes in comparison to Haley's 49. As expected, Republicans have a supermajority in both chambers of congress, but notably Republican Senator from Mississippi Cindy Hyde-Smith has lost re-election by a mere 0.1% in an upset, Mississippi went to Haley by 8.5%. There are also 4 Democrats who were elected in districts that Haley won: London Lamar in TN-09, Jamie Ager in NC-11, Richard Ojeda in NC-09, and Nancy Lacore in SC-01. In total, Democrats won 19 sets in the House in comparison to the Republicans' 46. Democrats have 4 seats in the senate in comparison to the Republicans' 12. Cooper has already called Haley to concede."
 usa.16.a:0 "Hail to the Chief!"